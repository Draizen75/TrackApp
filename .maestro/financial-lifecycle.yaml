appId: com.draizen.TrackApp
---
# End-to-end financial lifecycle on a clean Android install:
# create debtor + debt, record a partial principal payment, then verify
# the remaining balance survives an app process restart.
# Start from a clean database, then fund the test wallet through the
# same Settings UI a real user uses. Debt-entry transactions that disburse
# digital float must not bypass the app's insufficient-balance guard.
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Earnings Collected"
    timeout: 30000
- tapOn:
    id: "tab-settings"
# The hosted emulator can surface a Pixel Launcher ANR dialog while switching
# tabs. If it intercepts the first tab press, dismiss it and retry the press.
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    id: "tab-settings"
# Also handle an ANR dialog that appears immediately after the retry.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: "wallet-balance-GCASH"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "wallet-balance-GCASH"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "wallet-balance-GCASH"
# The emulator can surface the Pixel Launcher ANR dialog again when opening
# the wallet modal. Dismiss it so it cannot intercept the balance-field tap.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: "wallet-balance-input"
    timeout: 10000
- tapOn:
    id: "wallet-balance-input"
- eraseText: 20
- inputText: "1000"
# Dismiss the numeric keyboard first. The wallet editor now handles Android
# back by dismissing the IME without closing the modal.
- hideKeyboard
- assertVisible: "Confirm Balance Override"
- tapOn:
    id: "confirm-wallet-balance"
- extendedWaitUntil:
    visible:
      id: "wallet-balance-GCASH"
    timeout: 15000
- assertVisible:
    id: "wallet-balance-GCASH"
- assertVisible: "Tap to override balance"

# Begin the debt lifecycle with the funded, clean test ledger.
- tapOn:
    id: "tab-quick-entry"
- extendedWaitUntil:
    visible:
      id: "base-transaction-amount"
    timeout: 15000
- tapOn:
    id: "base-transaction-amount"
- inputText: "100"
- tapOn:
    id: "edit-service-fee"
- tapOn:
    id: "service-fee"
- eraseText: 20
- inputText: "0"
- hideKeyboard
- tapOn:
    id: "record-as-customer-debt"
# The customer field is below the recent-debt chips on smaller screens.
# Scroll the main form until the input is actually on-screen before tapping.
- scrollUntilVisible:
    element:
      id: "debtor-customer-name"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "debtor-customer-name"
- inputText: "Maestro QA Debt"
- hideKeyboard
- tapOn:
    id: "log-transaction"
# Verify the durable result rather than relying on a short-lived animated toast.
# A visible debtor record confirms that both customer creation and debt logging
# completed and were persisted.
# Wait for the entry screen and keyboard dismissal before navigating.
- extendedWaitUntil:
    visible:
      id: "base-transaction-amount"
    timeout: 15000
- tapOn:
    id: "tab-debtors"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 20000
- assertVisible: "₱100.00"
- tapOn: "Settle"
- extendedWaitUntil:
    visible: "Settle Ledger"
    timeout: 10000
- tapOn:
    id: "settlement-total-received"
- eraseText: 20
- inputText: "40"
# Dismiss the IME; the settlement modal now handles Android back safely.
- hideKeyboard
- assertVisible: "Confirm Payment"
- assertVisible: "Debt balance applied"
- assertVisible: "₱40.00"
- tapOn: "Confirm Payment"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 15000
- tapOn: "Maestro QA Debt"
- extendedWaitUntil:
    visible: "Remaining ₱60.00"
    timeout: 15000
- assertVisible: "Remaining ₱60.00"

# A process restart must not lose or duplicate the saved ledger state.
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Earnings Collected"
    timeout: 15000
- tapOn:
    id: "tab-debtors"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 15000
- assertVisible: "₱60.00"

# Final settlement separates the remaining principal from extra profit.
- tapOn: "Maestro QA Debt"
- extendedWaitUntil:
    visible: "Debtor Statement"
    timeout: 10000
- tapOn: "Settle"
- extendedWaitUntil:
    visible: "Settle Ledger"
    timeout: 10000
- tapOn:
    text: "Settlement total received"
- eraseText: 20
- inputText: "65"
- tapOn:
    id: "settlement-extra-profit"
- eraseText: 20
- inputText: "5"
- hideKeyboard
# Confirm the button is exposed after the keyboard is dismissed.
- assertVisible: "Confirm Payment"
- assertVisible: "Debt balance applied"
- assertVisible: "₱60.00"
- assertVisible: "Extra profit"
- assertVisible: "₱5.00"
- tapOn: "Confirm Payment"

# Fully settled customers are intentionally moved out of Active Debts and
# shown under the collapsed Settled Accounts & History section.
- extendedWaitUntil:
    visible:
      id: "settled-accounts-toggle"
    timeout: 15000
- tapOn:
    id: "settled-accounts-toggle"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 10000
- assertVisible: "Maestro QA Debt"
- tapOn: "Maestro QA Debt"
- extendedWaitUntil:
    visible: "Debtor Statement"
    timeout: 10000
- assertVisible: "Earnings Paid"
- assertVisible: "₱5.00"
- assertVisible: "Current Balance"
