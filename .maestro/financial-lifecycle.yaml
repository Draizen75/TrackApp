appId: com.draizen.TrackApp
---
# End-to-end financial lifecycle on a clean Android install:
# create debtor + debt, record a partial principal payment, then verify
# the remaining balance survives an app process restart.
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Earnings Collected"
    timeout: 30000

- tapOn: "Quick Entry"
- tapOn:
    id: "base-transaction-amount"
- inputText: "100"
- tapOn:
    id: "edit-service-fee"
- tapOn:
    id: "service-fee"
- inputText: "0"
- hideKeyboard
- tapOn: "Record as customer debt"
# The customer field is below the recent-debt chips on smaller screens.
# Scroll the main form until the input is actually on-screen before tapping.
- scrollUntilVisible:
    element:
      id: "debtor-customer-name"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "debtor-customer-name"
- inputText: "Maestro QA Debt"
- hideKeyboard
- tapOn: "LOG TRANSACTION"
- extendedWaitUntil:
    visible: "Transaction logged successfully!"
    timeout: 15000

- tapOn: "Debtors"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 15000
- assertVisible: "₱100.00"
- tapOn: "Settle"
- extendedWaitUntil:
    visible: "Settle Ledger"
    timeout: 10000
- tapOn:
    id: "settlement-total-received"
- eraseText: 20
- inputText: "40"
- hideKeyboard
- assertVisible: "Principal applied"
- assertVisible: "₱40.00"
- tapOn: "Confirm Payment"
- extendedWaitUntil:
    visible: "Remaining ₱60.00"
    timeout: 15000
- assertVisible: "Remaining ₱60.00"

# A process restart must not lose or duplicate the saved ledger state.
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- tapOn: "Debtors"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 15000
- assertVisible: "₱60.00"

# Final settlement separates the remaining principal from extra profit.
- tapOn: "Maestro QA Debt"
- extendedWaitUntil:
    visible: "Debtor Statement"
    timeout: 10000
- tapOn: "Settle"
- extendedWaitUntil:
    visible: "Settle Ledger"
    timeout: 10000
- tapOn:
    id: "settlement-total-received"
- eraseText: 20
- inputText: "65"
- tapOn:
    id: "settlement-extra-profit"
- eraseText: 20
- inputText: "5"
- hideKeyboard
- assertVisible: "Principal applied"
- assertVisible: "₱60.00"
- assertVisible: "Extra profit"
- assertVisible: "₱5.00"
- tapOn: "Confirm Payment"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 15000
- tapOn: "Maestro QA Debt"
- extendedWaitUntil:
    visible: "Debtor Statement"
    timeout: 10000
- assertVisible: "Earnings Paid"
- assertVisible: "₱5.00"
- assertVisible: "Current Balance"
