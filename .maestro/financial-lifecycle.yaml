appId: com.draizen.TrackApp
---
# End-to-end financial lifecycle on a clean Android install:
# create debtor + debt, record a partial principal payment, then verify
# the remaining balance survives an app process restart.
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Earnings Collected"
    timeout: 30000

- tapOn: "Quick Entry"
- tapOn:
    id: "base-transaction-amount"
- inputText: "100"
- tapOn:
    id: "edit-service-fee"
- tapOn:
    id: "service-fee"
- inputText: "0"
- hideKeyboard
- tapOn:
    id: "record-as-customer-debt"
# The customer field is below the recent-debt chips on smaller screens.
# Scroll the main form until the input is actually on-screen before tapping.
- scrollUntilVisible:
    element:
      text: "Search or enter debtor name..."
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "debtor-customer-name"
- inputText: "Maestro QA Debt"
- hideKeyboard
- tapOn:
    id: "log-transaction"
# Verify the durable result rather than relying on a short-lived animated toast.
# A visible debtor record confirms that both customer creation and debt logging
# completed and were persisted.
# The center item in the five-tab bottom bar is Debtors.
# Use Maestro's supported point selector because native tab labels/test IDs
# are not consistently exposed in the hosted Android accessibility tree.
- tapOn:
    point: "50%, 91%"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 20000
- assertVisible: "₱100.00"
- tapOn: "Settle"
- extendedWaitUntil:
    visible: "Settle Ledger"
    timeout: 10000
- tapOn:
    text: "Settlement total received"
- eraseText: 20
- inputText: "40"
- hideKeyboard
- assertVisible: "Principal applied"
- assertVisible: "₱40.00"
- tapOn: "Confirm Payment"
- extendedWaitUntil:
    visible: "Remaining ₱60.00"
    timeout: 15000
- assertVisible: "Remaining ₱60.00"

# A process restart must not lose or duplicate the saved ledger state.
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
# The center item in the five-tab bottom bar is Debtors.
# Use Maestro's supported point selector because native tab labels/test IDs
# are not consistently exposed in the hosted Android accessibility tree.
- tapOn:
    point: "50%, 91%"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 15000
- assertVisible: "₱60.00"

# Final settlement separates the remaining principal from extra profit.
- tapOn: "Maestro QA Debt"
- extendedWaitUntil:
    visible: "Debtor Statement"
    timeout: 10000
- tapOn: "Settle"
- extendedWaitUntil:
    visible: "Settle Ledger"
    timeout: 10000
- tapOn:
    text: "Settlement total received"
- eraseText: 20
- inputText: "65"
- tapOn:
    text: "Settlement extra profit"
- eraseText: 20
- inputText: "5"
- hideKeyboard
- assertVisible: "Principal applied"
- assertVisible: "₱60.00"
- assertVisible: "Extra profit"
- assertVisible: "₱5.00"
- tapOn: "Confirm Payment"
- extendedWaitUntil:
    visible: "Maestro QA Debt"
    timeout: 15000
- tapOn: "Maestro QA Debt"
- extendedWaitUntil:
    visible: "Debtor Statement"
    timeout: 10000
- assertVisible: "Earnings Paid"
- assertVisible: "₱5.00"
- assertVisible: "Current Balance"
