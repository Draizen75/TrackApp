name: TrackApp CI

on:
  pull_request:
    branches: [main]
  # Feature branches are validated by pull_request only. This avoids running
  # the same full CI suite once for push and again for the PR merge ref.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trackapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and SQLite regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Jest regression suite
        run: npm test -- --ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  android-e2e:
    name: Android emulator UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Set up Maestro
        uses: remarkablemark/setup-maestro-cli@v1

      # Use a runner-installed Gradle distribution instead of relying on
      # the generated project's Gradle wrapper being present.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Android emulator and run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/scripts/android-e2e.sh

      - name: Prepare Android test artifacts
        if: always()
        run: |
          mkdir -p .maestro-results .android-diagnostics
          if [ ! -f .android-diagnostics/runner-started.txt ]; then
            echo "Android test script did not create diagnostics in the workspace." > .android-diagnostics/artifact-note.txt
          fi
          if [ ! -f .maestro-results/financial-lifecycle-junit.xml ]; then
            echo "Maestro did not produce a JUnit report; inspect the Android job logs and diagnostics." > .maestro-results/artifact-note.txt
          fi

      - name: Upload Android UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-results
          path: |
            .maestro-results/
            .android-diagnostics/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # The emulator test script already builds and installs this exact APK.
      # Upload it so the same tested build can be installed on a physical device.
      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrackApp-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14
