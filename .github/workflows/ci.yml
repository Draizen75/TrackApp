name: TrackApp CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: trackapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and SQLite regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Jest regression suite
        run: npm test -- --ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  android-e2e:
    name: Android emulator UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Set up Maestro
        uses: remarkablemark/setup-maestro-cli@v1

      # Use a runner-installed Gradle distribution instead of relying on
      # the generated project's Gradle wrapper being present.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Android emulator and run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices -l
            adb wait-for-device
            adb shell getprop sys.boot_completed
            echo "Inspect generated Android project:"
            ls -la android
            gradle --no-daemon -p android assembleDebug
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p .maestro-results

            # Debug React Native builds load their JavaScript bundle from Metro.
            # Start Metro on the runner and forward the emulator's port to it.
            CI=1 npx expo start --host localhost --port 8081 > .maestro-results/metro.log 2>&1 &
            METRO_PID=$!
            for attempt in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:8081/status | grep -q "running"; then
                break
              fi
              sleep 2
            done
            if ! curl --silent --fail http://127.0.0.1:8081/status | grep -q "running"; then
              echo "Metro did not become ready. Recent Metro output:"
              tail -n 100 .maestro-results/metro.log || true
              exit 1
            fi
            adb reverse tcp:8081 tcp:8081

            # Keep diagnostics even when Maestro assertions fail.
            set +e
            maestro test --format junit --output .maestro-results/junit.xml .maestro
            TEST_EXIT_CODE=$?
            set -e

            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              echo "Maestro failed; capturing Android diagnostics."
              adb exec-out screencap -p > .maestro-results/failure-screen.png || true
              adb shell uiautomator dump /sdcard/maestro-window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/maestro-window.xml .maestro-results/window.xml >/dev/null 2>&1 || true
              adb logcat -d -v time > .maestro-results/logcat.txt || true
              tail -n 150 .maestro-results/metro.log || true
            fi

            kill "$METRO_PID" >/dev/null 2>&1 || true
            exit "$TEST_EXIT_CODE"

      - name: Upload Android UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-results
          path: .maestro-results/
          if-no-files-found: ignore
          retention-days: 7
