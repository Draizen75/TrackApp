name: TrackApp CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: trackapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and SQLite regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Jest regression suite
        run: npm test -- --ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  android-e2e:
    name: Android emulator UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Set up Maestro
        uses: remarkablemark/setup-maestro-cli@v1

      # Use a runner-installed Gradle distribution instead of relying on
      # the generated project's Gradle wrapper being present.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Android emulator and run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices -l
            adb wait-for-device
            adb shell getprop sys.boot_completed
            echo "Inspect generated Android project:"
            ls -la android
            gradle --no-daemon -p android assembleDebug
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p .maestro-results
            maestro test --format junit --output .maestro-results/junit.xml .maestro

      - name: Upload Android UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-results
          path: .maestro-results/
          if-no-files-found: ignore
          retention-days: 7
